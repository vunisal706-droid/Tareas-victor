<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victask</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f6ff;
      color: #1b3b5f;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(90deg, #3a7bd5, #3a6073);
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 1.5em;
      font-weight: 600;
      letter-spacing: 1px;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #e1ecfa;
      overflow-x: auto;
    }
    nav button {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 0.95em;
      color: #1b3b5f;
      font-weight: 600;
      white-space: nowrap;
      min-width: 80px;
    }
    nav button.active {
      border-bottom: 3px solid #3a7bd5;
    }
    main {
      padding: 20px;
    }
    section { display: none; }
    section.active { display: block; }

    input, button {
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #c2d4f2;
    }
    button {
      background-color: #3a7bd5;
      color: white;
      font-weight: 600;
      border: none;
      margin-left: 6px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #ffffff;
      margin: 8px 0;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: move;
      transition: all 0.2s ease;
    }
    li:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    li.dragging {
      opacity: 0.5;
      transform: scale(1.02);
    }
    li.drag-over {
      border-top: 3px solid #3a7bd5;
    }
    li.prioritaria {
      background: #ffe6e6;
      border-left: 4px solid #c0392b;
    }
    li.pasada {
      opacity: 0.6;
      background: #f5f5f5;
    }
    li.vencida {
      background: #fff3cd;
      border-left: 4px solid #f39c12;
    }
    li button {
      background-color: #c0392b;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      color: white;
      font-size: 0.9em;
    }
    li button.whatsapp {
      background-color: #25D366;
      margin-right: 5px;
      padding: 8px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    li button.whatsapp svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
    li button.prioridad {
      background-color: #f39c12;
      margin-right: 5px;
      padding: 6px 10px;
    }
    li button.prioridad.activa {
      background-color: #c0392b;
    }
    .checkbox-container {
      display: inline-flex;
      align-items: center;
      margin-left: 10px;
    }
    .checkbox-container input {
      margin: 0 5px 0 0;
      width: auto;
    }
    .checkbox-container label {
      margin: 0;
      font-size: 0.9em;
      color: #c0392b;
      font-weight: 600;
    }
    .tarea-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .tarea-texto {
      font-weight: 400;
    }
    .tarea-fecha-vencimiento {
      font-size: 0.85em;
      color: #597ca2;
      margin-top: 4px;
    }
    .fecha-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .fecha-texto {
      font-weight: 600;
    }
    .fecha-dias {
      font-size: 0.85em;
      color: #597ca2;
      margin-top: 4px;
    }
    .botones-fecha {
      display: flex;
      gap: 5px;
    }
    .botones-tarea {
      display: flex;
      gap: 5px;
    }
    .input-opcional {
      margin-top: 8px;
      font-size: 0.9em;
    }
    #btnNotificaciones {
      background-color: #f39c12;
      margin-left: 10px;
      padding: 8px 12px;
      font-size: 0.9em;
    }
    #btnNotificaciones.activo {
      background-color: #27ae60;
    }
    .drag-handle {
      cursor: move;
      padding: 0 8px;
      color: #597ca2;
      font-size: 1.2em;
      user-select: none;
    }

    /* Estilos para Horario/Dipa */
    .documento-container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-top: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .documento-container h4 {
      color: #1b3b5f;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.1em;
    }
    .documento-vacio {
      text-align: center;
      padding: 30px 20px;
      color: #597ca2;
      background: #f8f9fa;
      border-radius: 6px;
      border: 2px dashed #c2d4f2;
    }
    .documento-vacio p {
      margin: 5px 0;
    }
    .documento-imagen-wrapper {
      position: relative;
      margin: 15px 0;
    }
    .documento-imagen {
      width: 100%;
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .documento-imagen:hover {
      transform: scale(1.02);
    }
    .btn-cambiar {
      background-color: #f39c12;
      margin-top: 10px;
    }
    .btn-eliminar {
      background-color: #c0392b;
      margin-left: 5px;
    }
    .input-file {
      display: none;
    }
    .separador {
      height: 2px;
      background: linear-gradient(to right, transparent, #c2d4f2, transparent);
      margin: 30px 0;
    }

    /* Modal de zoom */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      overflow: auto;
    }
    .modal.active {
      display: block;
    }
    .modal-content {
      margin: auto;
      display: block;
      width: 90%;
      max-width: 900px;
      margin-top: 50px;
      touch-action: none;
      cursor: grab;
      transition: transform 0.2s ease;
    }
    .modal-content:active {
      cursor: grabbing;
    }
    .modal-close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-close:hover {
      color: #bbb;
    }

    footer {
      text-align: center;
      font-size: 0.8em;
      color: #597ca2;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>✅ Victask</header>
  <nav>
    <button id="btnTareas" class="active">Tareas</button>
    <button id="btnFechas">Fechas</button>
    <button id="btnHorario">Horario/Dipa</button>
    <button id="btnCompra">Compra</button>
  </nav>
  <main>
    <section id="tareas" class="active">
      <h3>Tareas pendientes</h3>
      <input id="nuevaTarea" type="text" placeholder="Escribe una tarea...">
      <div class="checkbox-container">
        <input id="checkPrioridadTarea" type="checkbox">
        <label for="checkPrioridadTarea">⭐ Prioritaria</label>
      </div>
      <button id="agregarTarea">Añadir</button>
      <div class="input-opcional">
        <input id="fechaVencimientoTarea" type="date" placeholder="Fecha límite (opcional)" style="width: 180px;">
        <label style="font-size: 0.85em; color: #597ca2; margin-left: 5px;">Fecha límite (opcional)</label>
      </div>
      <ul id="listaTareas"></ul>
    </section>

    <section id="fechas">
      <h3>Fechas importantes</h3>
      <div>
        <input id="nuevaFecha" type="date">
        <input id="horaFecha" type="time">
        <input id="descripcionFecha" type="text" placeholder="Descripción o evento...">
        <div class="checkbox-container">
          <input id="checkPrioridad" type="checkbox">
          <label for="checkPrioridad">⭐ Prioritaria</label>
        </div>
        <button id="agregarFecha">Añadir</button>
        <button id="btnNotificaciones">🔔 Activar Notificaciones</button>
      </div>
      <ul id="listaFechas"></ul>
    </section>

    <section id="horario">
      <h3>📚 Horario / Dipa</h3>
      
      <!-- HORARIO ESCOLAR -->
      <div class="documento-container">
        <h4>📅 Horario Escolar</h4>
        <div id="horarioVacio" class="documento-vacio">
          <p>📸 Sube una foto de tu horario</p>
        </div>
        <div id="horarioContenido" style="display: none;">
          <div class="documento-imagen-wrapper">
            <img id="imagenHorario" class="documento-imagen" alt="Horario escolar">
          </div>
          <button id="btnCambiarHorario" class="btn-cambiar">📷 Cambiar foto</button>
          <button id="btnEliminarHorario" class="btn-eliminar">🗑️ Eliminar</button>
        </div>
        <input type="file" id="inputHorario" class="input-file" accept="image/*" capture="environment">
        <button id="btnSubirHorario">📸 Subir Horario</button>
      </div>

      <div class="separador"></div>

      <!-- TARJETA DIPA -->
      <div class="documento-container">
        <h4>🎫 Tarjeta DIPA</h4>
        <div id="dipaVacio" class="documento-vacio">
          <p>📸 Sube una foto de tu tarjeta DIPA</p>
        </div>
        <div id="dipaContenido" style="display: none;">
          <div class="documento-imagen-wrapper">
            <img id="imagenDipa" class="documento-imagen" alt="Tarjeta DIPA">
          </div>
          <button id="btnCambiarDipa" class="btn-cambiar">📷 Cambiar foto</button>
          <button id="btnEliminarDipa" class="btn-eliminar">🗑️ Eliminar</button>
        </div>
        <input type="file" id="inputDipa" class="input-file" accept="image/*" capture="environment">
        <button id="btnSubirDipa">📸 Subir DIPA</button>
      </div>
    </section>

    <section id="compra">
      <h3>Lista de la compra</h3>
      <input id="nuevoProducto" type="text" placeholder="Escribe un producto...">
      <button id="agregarProducto">Añadir</button>
      <button id="compartirTodaLista" style="background-color: #25D366; margin-left: 10px;">📤 Compartir Lista</button>
      <ul id="listaCompra"></ul>
    </section>
  </main>

  <!-- Modal para zoom de imagen -->
  <div id="modalZoom" class="modal">
    <span class="modal-close" id="cerrarModal">&times;</span>
    <img class="modal-content" id="imagenZoom">
  </div>

  <footer>© CEIP Capitulaciones · Victask</footer>

  <script>
    // Utilidad para generar IDs únicos
    function generarId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    // Cambio de secciones
    const btnTareas = document.getElementById('btnTareas');
    const btnFechas = document.getElementById('btnFechas');
    const btnHorario = document.getElementById('btnHorario');
    const btnCompra = document.getElementById('btnCompra');
    const secTareas = document.getElementById('tareas');
    const secFechas = document.getElementById('fechas');
    const secHorario = document.getElementById('horario');
    const secCompra = document.getElementById('compra');

    function activarSeccion(seccionActiva, botonActivo) {
      [secTareas, secFechas, secHorario, secCompra].forEach(s => s.classList.remove('active'));
      [btnTareas, btnFechas, btnHorario, btnCompra].forEach(b => b.classList.remove('active'));
      seccionActiva.classList.add('active');
      botonActivo.classList.add('active');
    }

    btnTareas.onclick = () => activarSeccion(secTareas, btnTareas);
    btnFechas.onclick = () => activarSeccion(secFechas, btnFechas);
    btnHorario.onclick = () => activarSeccion(secHorario, btnHorario);
    btnCompra.onclick = () => activarSeccion(secCompra, btnCompra);

    // HORARIO
    const inputHorario = document.getElementById('inputHorario');
    const btnSubirHorario = document.getElementById('btnSubirHorario');
    const btnCambiarHorario = document.getElementById('btnCambiarHorario');
    const btnEliminarHorario = document.getElementById('btnEliminarHorario');
    const imagenHorario = document.getElementById('imagenHorario');
    const horarioVacio = document.getElementById('horarioVacio');
    const horarioContenido = document.getElementById('horarioContenido');

    // DIPA
    const inputDipa = document.getElementById('inputDipa');
    const btnSubirDipa = document.getElementById('btnSubirDipa');
    const btnCambiarDipa = document.getElementById('btnCambiarDipa');
    const btnEliminarDipa = document.getElementById('btnEliminarDipa');
    const imagenDipa = document.getElementById('imagenDipa');
    const dipaVacio = document.getElementById('dipaVacio');
    const dipaContenido = document.getElementById('dipaContenido');

    // Función para comprimir imágenes
    function comprimirImagen(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          
          // Reducir tamaño si es muy grande
          const maxDimension = 1200;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = (height / width) * maxDimension;
              width = maxDimension;
            } else {
              width = (width / height) * maxDimension;
              height = maxDimension;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // Comprimir a calidad 0.7 (70%)
          const imagenComprimida = canvas.toDataURL('image/jpeg', 0.7);
          callback(imagenComprimida);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Modal
    const modalZoom = document.getElementById('modalZoom');
    const imagenZoom = document.getElementById('imagenZoom');
    const cerrarModal = document.getElementById('cerrarModal');

    function cargarHorario() {
      const horarioGuardado = localStorage.getItem('horarioImagen');
      if (horarioGuardado) {
        imagenHorario.src = horarioGuardado;
        horarioVacio.style.display = 'none';
        horarioContenido.style.display = 'block';
        btnSubirHorario.style.display = 'none';
      } else {
        horarioVacio.style.display = 'block';
        horarioContenido.style.display = 'none';
        btnSubirHorario.style.display = 'inline-block';
      }
    }

    function cargarDipa() {
      const dipaGuardado = localStorage.getItem('dipaImagen');
      if (dipaGuardado) {
        imagenDipa.src = dipaGuardado;
        dipaVacio.style.display = 'none';
        dipaContenido.style.display = 'block';
        btnSubirDipa.style.display = 'none';
      } else {
        dipaVacio.style.display = 'block';
        dipaContenido.style.display = 'none';
        btnSubirDipa.style.display = 'inline-block';
      }
    }

    btnSubirHorario.onclick = () => inputHorario.click();
    btnCambiarHorario.onclick = () => inputHorario.click();

    btnSubirDipa.onclick = () => inputDipa.click();
    btnCambiarDipa.onclick = () => inputDipa.click();

    inputHorario.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        comprimirImagen(file, (imagenComprimida) => {
          try {
            localStorage.setItem('horarioImagen', imagenComprimida);
            cargarHorario();
            console.log('✅ Horario guardado correctamente');
          } catch (error) {
            console.error('Error al guardar horario:', error);
            alert('❌ Error: La imagen es demasiado grande. Intenta con una foto de menor resolución.');
          }
        });
      }
    };

    inputDipa.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        comprimirImagen(file, (imagenComprimida) => {
          try {
            localStorage.setItem('dipaImagen', imagenComprimida);
            cargarDipa();
            console.log('✅ Tarjeta DIPA guardada correctamente');
          } catch (error) {
            console.error('Error al guardar DIPA:', error);
            alert('❌ Error: La imagen es demasiado grande. Intenta con una foto de menor resolución.');
          }
        });
      }
    };

    btnEliminarHorario.onclick = () => {
      if (confirm('¿Seguro que quieres eliminar el horario?')) {
        localStorage.removeItem('horarioImagen');
        cargarHorario();
      }
    };

    btnEliminarDipa.onclick = () => {
      if (confirm('¿Seguro que quieres eliminar la tarjeta DIPA?')) {
        localStorage.removeItem('dipaImagen');
        cargarDipa();
      }
    };

    // Zoom de imagen
    let scale = 1;
    let panning = false;
    let pointX = 0;
    let pointY = 0;
    let start = { x: 0, y: 0 };

    function resetZoom() {
      scale = 1;
      imagenZoom.style.transform = `translate(0px, 0px) scale(1)`;
      imagenZoom.style.transformOrigin = 'center center';
    }

    imagenHorario.onclick = () => {
      modalZoom.classList.add('active');
      imagenZoom.src = imagenHorario.src;
      resetZoom();
    };

    imagenDipa.onclick = () => {
      modalZoom.classList.add('active');
      imagenZoom.src = imagenDipa.src;
      resetZoom();
    };

    cerrarModal.onclick = () => {
      modalZoom.classList.remove('active');
      resetZoom();
    };

    modalZoom.onclick = (e) => {
      if (e.target === modalZoom) {
        modalZoom.classList.remove('active');
        resetZoom();
      }
    };

    // Soporte para zoom con rueda del ratón (escritorio)
    imagenZoom.onwheel = (e) => {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = e.wheelDelta ? e.wheelDelta : -e.deltaY;
      
      if (delta > 0) {
        scale *= 1.2;
      } else {
        scale /= 1.2;
      }
      
      scale = Math.max(1, Math.min(5, scale)); // Limitar entre 1x y 5x
      
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      
      imagenZoom.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      imagenZoom.style.transformOrigin = '0 0';
    };

    // Soporte para pinch-to-zoom en móvil
    let initialDistance = 0;
    let currentScale = 1;

    imagenZoom.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        initialDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        currentScale = scale;
      } else if (e.touches.length === 1 && scale > 1) {
        panning = true;
        start = { x: e.touches[0].clientX - pointX, y: e.touches[0].clientY - pointY };
      }
    });

    imagenZoom.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const distance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        
        scale = currentScale * (distance / initialDistance);
        scale = Math.max(1, Math.min(5, scale)); // Limitar entre 1x y 5x
        
        imagenZoom.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        imagenZoom.style.transformOrigin = '0 0';
      } else if (e.touches.length === 1 && panning && scale > 1) {
        e.preventDefault();
        pointX = e.touches[0].clientX - start.x;
        pointY = e.touches[0].clientY - start.y;
        imagenZoom.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      }
    });

    imagenZoom.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        panning = false;
        // Si el zoom vuelve a 1, reiniciar posición
        if (scale === 1) {
          pointX = 0;
          pointY = 0;
          imagenZoom.style.transform = `translate(0px, 0px) scale(1)`;
        }
      }
    });

    // Doble toque para hacer zoom
    let lastTap = 0;
    imagenZoom.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        // Doble toque detectado
        if (scale === 1) {
          scale = 2.5;
          const rect = imagenZoom.getBoundingClientRect();
          pointX = rect.width / 4;
          pointY = rect.height / 4;
        } else {
          scale = 1;
          pointX = 0;
          pointY = 0;
        }
        imagenZoom.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      }
      lastTap = currentTime;
    });

    cargarHorario();
    cargarDipa();

    // Tareas con drag & drop
    const listaTareas = document.getElementById('listaTareas');
    const nuevaTarea = document.getElementById('nuevaTarea');
    const agregarTarea = document.getElementById('agregarTarea');
    const checkPrioridadTarea = document.getElementById('checkPrioridadTarea');
    const fechaVencimientoTarea = document.getElementById('fechaVencimientoTarea');

    let draggedElement = null;

    function guardarTareas(tareas) {
      localStorage.setItem('tareas', JSON.stringify(tareas));
    }

    function obtenerTareas() {
      const tareas = JSON.parse(localStorage.getItem('tareas') || '[]');
      // Migrar tareas antiguas sin ID
      return tareas.map(t => {
        if (!t.id) t.id = generarId();
        return t;
      });
    }

    function calcularDiasRestantes(fechaISO) {
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const fechaObjetivo = new Date(fechaISO);
      const diferencia = fechaObjetivo - hoy;
      const dias = Math.ceil(diferencia / (1000 * 60 * 60 * 24));
      
      if (dias === 0) return { dias: 0, texto: '¡Vence hoy!', vencida: true };
      if (dias === 1) return { dias: 1, texto: 'Vence mañana', vencida: false };
      if (dias < 0) return { dias: dias, texto: `Venció hace ${Math.abs(dias)} día${Math.abs(dias) > 1 ? 's' : ''}`, vencida: true };
      if (dias <= 3) return { dias: dias, texto: `Vence en ${dias} días ⚠️`, vencida: false };
      return { dias: dias, texto: `Vence en ${dias} días`, vencida: false };
    }

    function cargarTareas() {
      const tareas = obtenerTareas();
      listaTareas.innerHTML = '';
      
      tareas.forEach((tarea) => añadirTareaALista(tarea));
    }

    function añadirTareaALista(tarea) {
      const li = document.createElement('li');
      li.draggable = true;
      li.dataset.id = tarea.id;
      
      if (tarea.prioritaria) {
        li.classList.add('prioritaria');
      }
      
      // Verificar si está vencida
      if (tarea.fechaVencimiento) {
        const info = calcularDiasRestantes(tarea.fechaVencimiento);
        if (info.vencida) {
          li.classList.add('vencida');
        }
      }
      
      // Drag handle
      const dragHandle = document.createElement('span');
      dragHandle.className = 'drag-handle';
      dragHandle.innerHTML = '⋮⋮';
      li.appendChild(dragHandle);
      
      const divInfo = document.createElement('div');
      divInfo.className = 'tarea-info';
      
      const span = document.createElement('div');
      span.className = 'tarea-texto';
      const prioridadIcon = tarea.prioritaria ? '⭐ ' : '';
      span.textContent = `${prioridadIcon}${tarea.texto}`;
      divInfo.appendChild(span);
      
      // Mostrar fecha de vencimiento si existe
      if (tarea.fechaVencimiento) {
        const spanFecha = document.createElement('div');
        spanFecha.className = 'tarea-fecha-vencimiento';
        const info = calcularDiasRestantes(tarea.fechaVencimiento);
        const fechaFormateada = new Date(tarea.fechaVencimiento).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        spanFecha.textContent = `📅 ${fechaFormateada} — ${info.texto}`;
        divInfo.appendChild(spanFecha);
      }
      
      li.appendChild(divInfo);
      
      const divBotones = document.createElement('div');
      divBotones.className = 'botones-tarea';
      
      // Botón prioridad
      const btnPrioridad = document.createElement('button');
      btnPrioridad.className = 'prioridad';
      if (tarea.prioritaria) {
        btnPrioridad.classList.add('activa');
        btnPrioridad.textContent = '⭐';
      } else {
        btnPrioridad.textContent = '☆';
      }
      btnPrioridad.onclick = () => {
        const tareas = obtenerTareas();
        const tareaIndex = tareas.findIndex(t => t.id === tarea.id);
        if (tareaIndex !== -1) {
          tareas[tareaIndex].prioritaria = !tareas[tareaIndex].prioritaria;
          guardarTareas(tareas);
          cargarTareas();
        }
      };
      divBotones.appendChild(btnPrioridad);
      
      // Botón Hecho
      const btnHecho = document.createElement('button');
      btnHecho.textContent = 'Hecho';
      btnHecho.onclick = () => {
        const tareas = obtenerTareas();
        const tareasFiltradas = tareas.filter(t => t.id !== tarea.id);
        guardarTareas(tareasFiltradas);
        cargarTareas();
      };
      divBotones.appendChild(btnHecho);
      
      li.appendChild(divBotones);
      
      // Eventos de drag & drop
      li.addEventListener('dragstart', (e) => {
        draggedElement = li;
        li.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      
      li.addEventListener('dragend', (e) => {
        li.classList.remove('dragging');
        document.querySelectorAll('#listaTareas li').forEach(item => {
          item.classList.remove('drag-over');
        });
      });
      
      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (draggedElement !== li) {
          li.classList.add('drag-over');
        }
      });
      
      li.addEventListener('dragleave', (e) => {
        li.classList.remove('drag-over');
      });
      
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        li.classList.remove('drag-over');
        
        if (draggedElement !== li) {
          const tareas = obtenerTareas();
          const draggedId = draggedElement.dataset.id;
          const targetId = li.dataset.id;
          
          const draggedIndex = tareas.findIndex(t => t.id === draggedId);
          const targetIndex = tareas.findIndex(t => t.id === targetId);
          
          if (draggedIndex !== -1 && targetIndex !== -1) {
            const [draggedItem] = tareas.splice(draggedIndex, 1);
            tareas.splice(targetIndex, 0, draggedItem);
            guardarTareas(tareas);
            cargarTareas();
          }
        }
      });
      
      listaTareas.appendChild(li);
    }

    agregarTarea.onclick = () => {
      if (nuevaTarea.value.trim()) {
        const tareas = obtenerTareas();
        const nuevaTareaObj = {
          id: generarId(),
          texto: nuevaTarea.value.trim(),
          prioritaria: checkPrioridadTarea.checked,
          fechaVencimiento: fechaVencimientoTarea.value || null
        };
        tareas.push(nuevaTareaObj);
        guardarTareas(tareas);
        nuevaTarea.value = '';
        checkPrioridadTarea.checked = false;
        fechaVencimientoTarea.value = '';
        cargarTareas();
      }
    };

    nuevaTarea.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') agregarTarea.click();
    });

    cargarTareas();

    // Fechas con IDs únicos
    const listaFechas = document.getElementById('listaFechas');
    const nuevaFecha = document.getElementById('nuevaFecha');
    const horaFecha = document.getElementById('horaFecha');
    const descripcionFecha = document.getElementById('descripcionFecha');
    const agregarFecha = document.getElementById('agregarFecha');
    const checkPrioridad = document.getElementById('checkPrioridad');
    const btnNotificaciones = document.getElementById('btnNotificaciones');

    nuevaFecha.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        horaFecha.focus();
      }
    });

    horaFecha.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        descripcionFecha.focus();
      }
    });

    descripcionFecha.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') agregarFecha.click();
    });

    btnNotificaciones.onclick = () => {
      if (Notification.permission === "granted") {
        alert("Las notificaciones ya están activadas");
        btnNotificaciones.classList.add('activo');
        btnNotificaciones.textContent = '🔔 Notificaciones Activadas';
        programarTodasLasNotificaciones();
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("Notificaciones activadas correctamente");
            btnNotificaciones.classList.add('activo');
            btnNotificaciones.textContent = '🔔 Notificaciones Activadas';
            programarTodasLasNotificaciones();
          } else {
            alert("Notificaciones denegadas");
          }
        });
      } else {
        alert("Las notificaciones están bloqueadas. Actívalas desde la configuración del navegador.");
      }
    };

    if (Notification.permission === "granted") {
      btnNotificaciones.classList.add('activo');
      btnNotificaciones.textContent = '🔔 Notificaciones Activadas';
    }

    function obtenerFechas() {
      const fechas = JSON.parse(localStorage.getItem('fechas') || '[]');
      // Migrar fechas antiguas sin ID
      return fechas.map(f => {
        if (!f.id) f.id = generarId();
        return f;
      });
    }

    function guardarFechas(fechas) {
      localStorage.setItem('fechas', JSON.stringify(fechas));
    }

    function eliminarFechasPasadas() {
      const fechas = obtenerFechas();
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      
      const fechasFiltradas = fechas.filter(f => {
        const fechaEvento = new Date(f.fechaISO);
        return fechaEvento >= hoy;
      });
      
      if (fechasFiltradas.length !== fechas.length) {
        guardarFechas(fechasFiltradas);
      }
    }

    function formatearFecha(fechaISO) {
      const fecha = new Date(fechaISO);
      const opciones = { day: 'numeric', month: 'short', year: 'numeric' };
      return fecha.toLocaleDateString('es-ES', opciones);
    }

    function calcularDiasRestantesFecha(fechaISO) {
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const fechaObjetivo = new Date(fechaISO);
      const diferencia = fechaObjetivo - hoy;
      const dias = Math.ceil(diferencia / (1000 * 60 * 60 * 24));
      
      if (dias === 0) return { dias: 0, texto: '¡Hoy!' };
      if (dias === 1) return { dias: 1, texto: 'Mañana' };
      if (dias < 0) return { dias: dias, texto: 'Fecha pasada' };
      return { dias: dias, texto: `Faltan ${dias} días` };
    }

    function ordenarYMostrarFechas() {
      const fechas = obtenerFechas();
      listaFechas.innerHTML = '';
      
      // Ordenar por prioridad y luego por fecha
      fechas.sort((a, b) => {
        if (a.prioritaria && !b.prioritaria) return -1;
        if (!a.prioritaria && b.prioritaria) return 1;
        return new Date(a.fechaISO) - new Date(b.fechaISO);
      });
      
      fechas.forEach((fecha) => mostrarFecha(fecha));
    }

    function mostrarFecha(fechaObj) {
      const li = document.createElement('li');
      const infoRestante = calcularDiasRestantesFecha(fechaObj.fechaISO);
      
      if (fechaObj.prioritaria) {
        li.classList.add('prioritaria');
      }
      
      if (infoRestante.dias < 0) {
        li.classList.add('pasada');
      }
      
      const divInfo = document.createElement('div');
      divInfo.className = 'fecha-info';
      
      const spanTexto = document.createElement('div');
      spanTexto.className = 'fecha-texto';
      const prioridadIcon = fechaObj.prioritaria ? '⭐ ' : '';
      spanTexto.textContent = `${prioridadIcon}${formatearFecha(fechaObj.fechaISO)} ${fechaObj.hora || ''} — ${fechaObj.descripcion}`;
      
      const spanDias = document.createElement('div');
      spanDias.className = 'fecha-dias';
      spanDias.textContent = infoRestante.texto;
      
      divInfo.appendChild(spanTexto);
      divInfo.appendChild(spanDias);
      li.appendChild(divInfo);
      
      const divBotones = document.createElement('div');
      divBotones.className = 'botones-fecha';
      
      // Botón prioridad
      const btnPrioridad = document.createElement('button');
      btnPrioridad.className = 'prioridad';
      if (fechaObj.prioritaria) {
        btnPrioridad.classList.add('activa');
        btnPrioridad.textContent = '⭐';
      } else {
        btnPrioridad.textContent = '☆';
      }
      btnPrioridad.onclick = () => {
        const fechas = obtenerFechas();
        const fechaIndex = fechas.findIndex(f => f.id === fechaObj.id);
        if (fechaIndex !== -1) {
          fechas[fechaIndex].prioritaria = !fechas[fechaIndex].prioritaria;
          guardarFechas(fechas);
          ordenarYMostrarFechas();
          programarNotificacion(fechas[fechaIndex]);
        }
      };
      divBotones.appendChild(btnPrioridad);
      
      // Botón WhatsApp
      const btnWhatsApp = document.createElement('button');
      btnWhatsApp.className = 'whatsapp';
      btnWhatsApp.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
      btnWhatsApp.onclick = () => {
        const texto = `${prioridadIcon}${formatearFecha(fechaObj.fechaISO)} ${fechaObj.hora || ''} — ${fechaObj.descripcion}`;
        const mensaje = encodeURIComponent(`📅 Fecha importante:\n${texto}`);
        window.open(`https://wa.me/?text=${mensaje}`, '_blank');
      };
      divBotones.appendChild(btnWhatsApp);
      
      // Botón Borrar
      const btn = document.createElement('button');
      btn.textContent = 'Borrar';
      btn.onclick = () => {
        const fechas = obtenerFechas();
        const fechasFiltradas = fechas.filter(f => f.id !== fechaObj.id);
        guardarFechas(fechasFiltradas);
        ordenarYMostrarFechas();
      };
      divBotones.appendChild(btn);
      
      li.appendChild(divBotones);
      listaFechas.appendChild(li);
    }

    function programarNotificacion(fechaObj) {
      if (Notification.permission !== "granted") return;

      const hoy = new Date();
      const fechaEvento = new Date(fechaObj.fechaISO + 'T' + (fechaObj.hora || '09:00'));
      
      // Notificación el día del evento
      if (fechaEvento > hoy) {
        const tiempoRestante = fechaEvento - hoy;
        if (tiempoRestante > 0 && tiempoRestante < 86400000) { // Dentro de 24 horas
          setTimeout(() => {
            const prioridad = fechaObj.prioritaria ? '⭐ PRIORITARIO - ' : '';
            new Notification(`${prioridad}Fecha importante`, {
              body: fechaObj.descripcion,
              icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png",
              requireInteraction: fechaObj.prioritaria
            });
          }, tiempoRestante);
        }
      }

      // Notificación 1 día antes a las 9 AM
      const unDiaAntes = new Date(fechaObj.fechaISO + 'T09:00:00');
      unDiaAntes.setDate(unDiaAntes.getDate() - 1);
      
      if (unDiaAntes > hoy) {
        const tiempoAntes = unDiaAntes - hoy;
        if (tiempoAntes > 0 && tiempoAntes < 86400000) {
          setTimeout(() => {
            const prioridad = fechaObj.prioritaria ? '⭐ ' : '';
            new Notification(`${prioridad}Recordatorio: Mañana`, {
              body: fechaObj.descripcion,
              icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png"
            });
          }, tiempoAntes);
        }
      }
    }

    function programarTodasLasNotificaciones() {
      const fechas = obtenerFechas();
      fechas.forEach(f => programarNotificacion(f));
    }

    agregarFecha.onclick = () => {
      if (nuevaFecha.value && descripcionFecha.value.trim()) {
        const fechas = obtenerFechas();
        
        const nuevaFechaObj = {
          id: generarId(),
          fechaISO: nuevaFecha.value,
          hora: horaFecha.value,
          descripcion: descripcionFecha.value.trim(),
          prioritaria: checkPrioridad.checked
        };
        
        fechas.push(nuevaFechaObj);
        guardarFechas(fechas);
        
        nuevaFecha.value = '';
        horaFecha.value = '';
        descripcionFecha.value = '';
        checkPrioridad.checked = false;
        
        ordenarYMostrarFechas();
        programarNotificacion(nuevaFechaObj);
      }
    };

    // Cargar fechas al inicio
    eliminarFechasPasadas();
    ordenarYMostrarFechas();
    programarTodasLasNotificaciones();

    // Verificar diariamente para eliminar fechas pasadas
    setInterval(() => {
      eliminarFechasPasadas();
      ordenarYMostrarFechas();
    }, 3600000); // Cada hora

    // Compra
    const listaCompra = document.getElementById('listaCompra');
    const nuevoProducto = document.getElementById('nuevoProducto');
    const agregarProducto = document.getElementById('agregarProducto');
    const compartirTodaLista = document.getElementById('compartirTodaLista');

    function guardarCompra() {
      localStorage.setItem('compra', JSON.stringify(
        [...listaCompra.querySelectorAll('li span')].map(span => span.textContent)
      ));
    }
    function cargarCompra() {
      const productos = JSON.parse(localStorage.getItem('compra') || '[]');
      productos.forEach(p => añadirProducto(p));
    }
    function añadirProducto(texto) {
      const li = document.createElement('li');
      li.style.cursor = 'default';
      const span = document.createElement('span');
      span.textContent = texto;
      li.appendChild(span);
      
      const btnWhatsApp = document.createElement('button');
      btnWhatsApp.className = 'whatsapp';
      btnWhatsApp.innerHTML = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
      btnWhatsApp.onclick = () => {
        const mensaje = encodeURIComponent(`🛒 Comprar:\n${texto}`);
        window.open(`https://wa.me/?text=${mensaje}`, '_blank');
      };
      li.appendChild(btnWhatsApp);
      
      const btn = document.createElement('button');
      btn.textContent = 'Comprado';
      btn.onclick = () => { li.remove(); guardarCompra(); };
      li.appendChild(btn);
      listaCompra.appendChild(li);
    }
    agregarProducto.onclick = () => {
      if (nuevoProducto.value.trim()) {
        añadirProducto(nuevoProducto.value.trim());
        nuevoProducto.value = '';
        guardarCompra();
      }
    };
    
    compartirTodaLista.onclick = () => {
      const productos = [...listaCompra.querySelectorAll('li span')].map(span => span.textContent);
      if (productos.length === 0) {
        alert('No hay productos en la lista para compartir');
        return;
      }
      const listaTexto = productos.map((p, i) => `${i + 1}. ${p}`).join('\n');
      const mensaje = encodeURIComponent(`🛒 Lista de la compra:\n\n${listaTexto}`);
      window.open(`https://wa.me/?text=${mensaje}`, '_blank');
    };
    
    nuevoProducto.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') agregarProducto.click();
    });
    
    cargarCompra();

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
